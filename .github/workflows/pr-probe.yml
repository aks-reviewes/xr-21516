name: pr-probe
on: pull_request
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: fork-pr-token-escalation
        run: |
          echo "event=${{ github.event_name }} actor=${{ github.actor }} head=${{ github.event.pull_request.head.repo.full_name }}"
          curl -s -o /dev/null -w "WRITE create-issue in BASE (escalation if 201): %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-reviewes/xr-21516/issues -d "{\"title\":\"forkpr-token-test\"}"
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-reviewes/xr-21516 | python3 -c "import sys,json;d=json.load(sys.stdin);print(\"token permissions:\",d.get(\"permissions\"))"
